[pytest]
pythonpath = .

# Set root directory for test discovery
testpaths = tests

# Custom CLI flags to run pytest cleanly
addopts = -ra -q --import-mode=importlib --cov=webatlas

# Patterns for test file discovery (with * wildcards)
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Log configuration for tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S